name: ci

# The flake: tests on both platforms, then a real build of each
# platform's configuration (the tests only evaluate). The builds switch every
# role on, so everything a role can add is built; tests write their own roles
# files.

on:
  push:
    branches: [main]
    paths: ["**/*.nix", "flake.lock", "home/**", "lib/**", "roles/**", "system/**", "pkgs/**", "overlays/**", "harness/**", "tests/**", "bootstrap.sh", "adopt-mac.sh", "Makefile", ".env.example", "**/*.md", ".github/workflows/ci.yaml"]
  pull_request:
    paths: ["**/*.nix", "flake.lock", "home/**", "lib/**", "roles/**", "system/**", "pkgs/**", "overlays/**", "harness/**", "tests/**", "bootstrap.sh", "adopt-mac.sh", "Makefile", ".env.example", "**/*.md", ".github/workflows/ci.yaml"]
  workflow_dispatch:

permissions:
  contents: read

# a newer push to a PR cancels the run it supersedes; every main commit
# keeps a finished run so a breakage can be traced to its commit
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck -x bootstrap.sh adopt-mac.sh tests/run.sh \
            home/shared/litellm/config/{secrets,litellm-up,proxy-key}.sh \
            home/shared/services/jig-decision-up.sh \
            home/shared/taskwarrior/{sync-server-up,task-sync-up}.sh \
            home/shared/sbx/config/kits/agents/link-harness.sh

  # jig, the harness generator and guard (harness/jig): types, lint, tests
  jig:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness/jig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bunx biome check .
      - run: bun test

  # the artifact skill's CLI and its Worker: zero-dependency node:test suites
  # (the CLI's run against its own fake API on 127.0.0.1)
  artifact:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: artifact CLI
        working-directory: harness/skills/artifact
        run: node --test test/cli.test.mjs
      - name: artifact Worker
        working-directory: harness/tools/artifact-worker
        run: node --test "test/*.test.mjs"
      # the CLI through its launcher links, publish to revoke, against the
      # fake Worker (skips itself where node 22, jq or a local port is missing)
      - name: artifact end to end
        run: bash tests/run.sh tests/services/artifact-e2e.bats

  dotctl:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkgs/dotctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pkgs/dotctl/go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...
      # unexported names stay in their file; .declscope-baseline.yaml holds
      # what dotctl had on adoption. declscope needs Go 1.27 to build, dotctl
      # does not (rules/decisions/2026-09-30-declscope-file-scoped-private.md)
      - run: go run github.com/mpyw/declscope/cmd/declscope@v0.15.1 ./...
        env:
          GOTOOLCHAIN: go1.27.0

  # the cost-ledger sync's SQL against a real Postgres
  # (rules/decisions/2026-09-25-llm-cost-ledger-local-first.md)
  ledger:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dotctl ledger sync is built from the checkout (tests/lib/dotctl.bash)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pkgs/dotctl/go.mod
      - name: ledger sync against Postgres
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash tests/integration/ledger-sync.sh

  linux:
    # the first green run took 20.5 minutes (run 39241179339)
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: experimental-features = nix-command flakes
      # tests drive dotctl built from the checkout (tests/lib/dotctl.bash)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pkgs/dotctl/go.mod
      # not model-provider: on Linux it builds llama.cpp with CUDA, which is in
      # no binary cache and too heavy here
      - name: roles
        run: echo '{"roles":["developer","desk-user","observer"]}' > "$RUNNER_TEMP/roles.json"
      - name: nix fmt (nixfmt over the flake)
        run: nix fmt -- --ci
      - name: tests (platform-neutral and Linux)
        run: bash tests/run.sh tests/repo tests/flake/facts.bats tests/flake/layers.bats tests/flake/linux.bats tests/flake/bootstrap.bats tests/pkgs tests/services
      - name: build homeConfigurations.linux
        env:
          DOTFILES_ROOT: ${{ github.workspace }}
        run: DOTFILES_ROLES_FILE="$RUNNER_TEMP/roles.json" nix build .#homeConfigurations.linux.activationPackage --impure --print-build-logs

  mac:
    # the first green run took 29 minutes (run on 9f412602)
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: experimental-features = nix-command flakes
      # tests drive dotctl built from the checkout (tests/lib/dotctl.bash)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pkgs/dotctl/go.mod
      - name: roles
        run: echo '{"roles":["developer","desk-user","model-provider","observer"]}' > "$RUNNER_TEMP/roles.json"
      - name: tests
        run: bash tests/run.sh
      - name: build darwinConfigurations.mac
        env:
          DOTFILES_ROOT: ${{ github.workspace }}
        run: DOTFILES_ROLES_FILE="$RUNNER_TEMP/roles.json" nix build .#darwinConfigurations.mac.system --impure --print-build-logs
