name: next

# The next/ layout: tests on both platforms, then a real build of each
# platform's configuration (the tests only evaluate). The builds switch every
# role on, so everything a role can add is built; tests write their own roles
# files.

on:
  push:
    branches: [main]
    paths: ["next/**", "tests/**", "domains/**", ".github/workflows/next.yaml"]
  pull_request:
    paths: ["next/**", "tests/**", "domains/**", ".github/workflows/next.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -x next/bootstrap.sh next/pkgs/scripts/*/*.sh tests/run.sh \
            domains/dev/config/litellm/{secrets,litellm-up,proxy-key}.sh \
            domains/dev/config/jig/jig-decision-up.sh

  dotctl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next/pkgs/dotctl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: next/pkgs/dotctl/go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...

  # the cost-ledger sync's SQL against a real Postgres
  # (rules/decisions/2026-09-25-llm-cost-ledger-local-first.md)
  ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: ledger sync against Postgres
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash tests/integration/ledger-sync.sh

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      # not model-provider: on Linux it builds llama.cpp with CUDA, which is in
      # no binary cache and too heavy here
      - name: roles
        run: echo '{"roles":["developer","desk-user","observer"]}' > "$RUNNER_TEMP/roles.json"
      - name: nix fmt (nixfmt over next/)
        working-directory: next
        run: nix fmt -- --ci
      - name: tests (platform-neutral and Linux)
        run: bash tests/run.sh tests/next/facts.bats tests/next/layers.bats tests/next/linux.bats tests/next/bootstrap.bats tests/pkgs tests/services
      - name: build homeConfigurations.linux
        env:
          DOTFILES_ROOT: ${{ github.workspace }}
        run: DOTFILES_ROLES_FILE="$RUNNER_TEMP/roles.json" nix build ./next#homeConfigurations.linux.activationPackage --impure --print-build-logs

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: roles
        run: echo '{"roles":["developer","desk-user","model-provider","observer"]}' > "$RUNNER_TEMP/roles.json"
      - name: tests
        run: bash tests/run.sh
      - name: build darwinConfigurations.mac
        env:
          DOTFILES_ROOT: ${{ github.workspace }}
        run: DOTFILES_ROLES_FILE="$RUNNER_TEMP/roles.json" nix build ./next#darwinConfigurations.mac.system --impure --print-build-logs
