# GENERATED by yoki lib/targets/gen.js --target omp.
# Edit domains/dev/config/omp/config.yml.template, permissions.yaml, and
# core/harness-models.json instead — this file is rewritten wholesale on
# every run, except for symbolPreset/composer/theme/setupVersion, which are carried
# forward from whatever omp itself already wrote here.

tools:
  approvalMode: yolo
  approval:
    eval: prompt

bash:
  patterns:
    - match: "curl * | sh"
      approval: deny
    - match: "git status *"
      approval: allow

modelRoles:
  default: anthropic/claude-fable-5

statusLine:
  preset: custom
  leftSegments:
    - model
    - path
    - git
  rightSegments:
    - context_pct
    - cost
  segmentOptions:
    path:
      abbreviate: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true

symbolPreset: unicode

composer:
  shape: box

theme:
  light: light

setupVersion: 2
