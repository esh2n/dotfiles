# Minimal permission layer for the T15 targets golden suite fixture — NOT
# the real core/permissions.yaml. One allow (a plain execpolicy-expressible
# Bash prefix) plus one hook-enforced deny: a curl-pipe-to-shell installer
# pattern, which has no execpolicy/omp-declarative equivalent (a pipe defeats
# the token-exact prefix matcher — see to-codex.js's toExecpolicyTokens) and
# is also explicitly marked `enforce: [hook]` so both generators surface it
# as something only a PreToolUse/tool_call hook can enforce.

allow:
  - pattern: "Bash(git status *)"

deny:
  - pattern: "Bash(curl * | sh)"
    reason: "installer scripts piped into a shell have no execpolicy prefix match"
    enforce: [hook]
  # Two path denies, one per shape, so the golden covers what each target can
  # and cannot express declaratively — and therefore what lands in
  # <out>/.yoki/permissions.json for pre-permission-guard.js.
  #   Read(~/…)  -> codex carries it in BOTH layers: the declarative
  #                 [permissions.yoki.filesystem] table AND the guard deny
  #                 list. The table is off under
  #                 --dangerously-bypass-approvals-and-sandbox and never
  #                 gated a shell `cat` anyway (codex has no read tool — a
  #                 read shells out as Bash), while hook denies still fire in
  #                 bypass mode, so the hook is the surviving layer.
  #                 omp has no declarative equivalent at all, so omp guards it
  #                 in the hook only.
  #   Edit(**/…) -> neither target expresses it, so BOTH guard it.
  - pattern: "Read(~/.ssh/id_*)"
    reason: "private keys"
  - pattern: "Edit(**/*.pem)"
    reason: "in-workspace write side of a secret-file glob"

# The guard floor, in the same shape as the real core layer: the two bash
# guards every harness must register whatever else its generator manages to
# translate. Present here so the golden covers omp's `floor` array and
# codex's floor verification, not just the allow/deny conversion.
guardFloor:
  - hook: git-guard.sh
    event: PreToolUse
    matcher: Bash
  - hook: unattended-guard.sh
    event: PreToolUse
    matcher: "Bash|Write|Edit"

defaultMode: auto
