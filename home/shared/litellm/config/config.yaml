# LiteLLM proxy — front-agnostic measuring gateway for the model tiers.
#
# Every front (pi / DSH / codex) points its base_url at this proxy; the proxy
# routes each alias to its provider and records TTFT / tokens / cost /
# prefix-cache-hit on /metrics (Prometheus) — front-independent, so the
# measurement survives a front swap. Decision record: writeup store
# yoki/2026-09-16-observability-proxy-litellm.
#
# Keys are NEVER written here: `api_key: os.environ/<VAR>` reads them from the
# process env, which `op run --env-file litellm.env` injects at launch (the
# op:// references live in litellm.env — pointers, not secrets). See README.md.

model_list:
  # The tiers' deployments are generated: which catalog models each tier uses
  # is harness/policy/tiers.json (`use`), what each model is is
  # harness/policy/models.json. Switch a tier with `dotctl llm use <tier>
  # <model>`; never edit between the markers by hand.
  # BEGIN jig:tiers (generated — edit policy/tiers.json, then jig apply)
  # main ← deepseek-flash
  # `deepseek/` passes the id straight through to api.deepseek.com. Measured on
  # this repo's bench: 10/10, TTFT 573 ms, 174 tok/s
  # (home/shared/litellm/config/bench/report-mimo-vs-deepseek.md).
  - model_name: main
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY

  # complex ← deepseek-v4-pro
  # Same DeepSeek key as deepseek-flash. Bench: 10/10, TTFT 798 ms, 69 tok/s
  # (report-mimo-vs-deepseek-pro.md).
  - model_name: complex
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY

  # deterministic ← qwen3.8-27b-linux (order 1)
  # The Omarchy desktop's llama-server (RTX 3090 Ti), over the tailnet; the
  # model id is the GGUF file name without .gguf (router mode). Health-checked
  # in the background, so while the desktop is off it is out of the pool;
  # cooldown_time is longer than health_check_interval
  # (docs/proxy/health_check_routing.md).
  - model_name: deterministic
    litellm_params:
      model: openai/Qwen3.8-27B-Q4_K_M
      api_base: os.environ/LINUX_MODEL_API_BASE
      api_key: os.environ/LINUX_MODEL_API_KEY
      order: 1
    model_info:
      allowed_fails: 1
      cooldown_time: 90

  # deterministic ← qwen3.8-27b-mac (order 2)
  # The Mac's LM Studio, loaded just in time and unloaded after 600 idle seconds
  # so the Mac's own model comes back
  # (lmstudio.ai/docs/app/api/ttl-and-auto-evict); 15.0 tok/s measured
  # (bench/report.md). Never probed: a probe is a real completion and would keep
  # Qwen loaded.
  - model_name: deterministic
    litellm_params:
      model: lm_studio/qwen/qwen3.8-27b@4bit
      api_base: os.environ/MAC_MODEL_API_BASE
      api_key: os.environ/MAC_MODEL_API_KEY
      order: 2
      extra_body:
        ttl: 600
    model_info:
      disable_background_health_check: true
  # END jig:tiers

litellm_settings:
  # Free OSS Prometheus exporter — this is the whole point of the proxy.
  callbacks: ["prometheus"]
  # /metrics is bearer-auth'd by default since v1.85.0. This setting governs
  # ONLY /metrics on the proxy port (4000), which is loopback-only on every
  # machine, so scraping it without the master key is fine. Cross-machine
  # scraping uses the dedicated metrics listener (--prometheus_metrics_port
  # 4001 in litellm-up.sh), which ignores this setting and has no key auth at
  # all — its boundary is the tailnet ACL. Flip this to true (and scrape with
  # the master key) only if port 4000 itself is ever exposed.
  require_auth_for_metrics_endpoint: false

general_settings:
  # Probe deterministic's desktop deployment every 60 s and take it out of
  # the pool while it fails, so a request goes straight to the Mac instead of
  # waiting on a powered-off machine (docs/proxy/health_check_routing.md). The
  # cloud tiers are not probed: a probe is a real, billed completion.
  background_health_checks: true
  health_check_interval: 60
  enable_health_check_routing: true
  # health_check_ignore_transient_errors stays OFF: it counts 408 as healthy
  # (proxy_server.py, "treat 429/408 endpoints as healthy"), and a powered-off
  # desktop answers the probe with exactly that timeout, so the flag kept the
  # desktop in the pool and every request hung on it (measured 2026-09-30).
  background_health_check_model_groups: ["deterministic"]
  # an on-demand GET /health skips the Mac deployment too (docs/proxy/health.md)
  health_check_skip_disabled_background_models: true
  # Gateway master key — a REAL secret since 2026-09-20 (ruling: the old
  # committed constant assumed loopback-only, but the observability stack
  # documents container-reachable paths to this gateway, so the trust boundary
  # is no longer "same uid on loopback" alone). Resolved at launch by
  # litellm-up.sh from op://llm-automation/litellm/credential via the same
  # service-account path as the provider key. Never commit a literal here.
  master_key: os.environ/LITELLM_MASTER_KEY
