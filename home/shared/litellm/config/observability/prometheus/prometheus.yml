# Prometheus scrape config for the local LLM gateway.
#
# One job: the LiteLLM proxy's Prometheus exporter — the local one, plus (once
# uncommented) the owner's other machines over the tailnet. LiteLLM exposes
# these counters from process memory, so this scrape is what turns a value that
# dies on restart into a stored time series.
#
# No credentials anywhere: the local gateway sets
# `require_auth_for_metrics_endpoint: false` because port 4000 is loopback-only
# (see ../config.yaml); the remote targets are LiteLLM's dedicated metrics
# listener, which has no key auth at all and is reachable only inside the
# tailnet ACL. Nothing secret is needed to scrape.

global:
  # 15s matches the gateway's own resolution: short enough that a 1-minute
  # request burst is visible, long enough that a day is a few MB of samples.
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    gateway: litellm-local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: litellm
    # The trailing slash matters: `/metrics` answers 307 and `/metrics/` answers
    # 200 (measured). Scrape the final URL directly rather than relying on
    # redirect handling.
    metrics_path: /metrics/
    static_configs:
      - targets: ["host.docker.internal:4000"]
        labels:
          layer: llm-gateway
          machine: local

      # ---- the owner's other machines (uncomment one entry per machine) ----
      #
      # Every machine runs its own loopback-only LiteLLM; this Prometheus is the
      # one place their numbers are aggregated (decision record:
      # rules/decisions/2026-09-23-home-llm-lm-studio-over-tailscale-litellm-local.md).
      #
      # PULL over the tailnet, not push: no pusher process on each machine, no
      # application-level auth token to distribute or rotate. The identity is
      # the tailnet itself — only the owner's devices can reach each other, and
      # `../../../tailscale/acl.hujson` narrows even that to tcp:4001 and
      # tcp:1234 between the owner's own devices.
      #
      # 4001 is LiteLLM's DEDICATED metrics listener (`--prometheus_metrics_port
      # 4001` in ../../litellm-up.sh, v1.101.0+), which each non-Mac machine
      # puts on its tailnet address with
      #   tailscale serve --bg --tcp 4001 tcp://127.0.0.1:4001
      # The chat API on 4000 is never served, so it stays loopback-only. The
      # dedicated listener has no LiteLLM key auth by design (vendor: "Permit
      # access only from trusted Prometheus or collector networks"), which is
      # exactly what the tailnet ACL provides — so no `authorization:` here.
      #
      # Target = MagicDNS name (<machine>.<tailnet>.ts.net) + 4001. If this
      # container cannot resolve *.ts.net (not measured), use the machine's
      # Tailscale IP (100.x.y.z, `tailscale ip -4` on that machine) instead.
      # `machine:` is what makes a per-machine breakdown possible; `layer:`
      # keeps the existing dashboards working unchanged.
      #
      # - targets: ["pc-b.<tailnet>.ts.net:4001"]
      #   labels:
      #     layer: llm-gateway
      #     machine: pc-b
      # - targets: ["laptop.<tailnet>.ts.net:4001"]
      #   labels:
      #     layer: llm-gateway
      #     machine: laptop

  # jig judgment service: the decision model (jev) does not go through the
  # LiteLLM proxy, so its cost and behaviour are invisible above — this is the
  # only place jev's token spend, tier fallback rate, and decision latency are
  # measured. Note the path is /metrics (no trailing slash; /metrics/ answers
  # 404 here, the opposite of the gateway).
  - job_name: jig
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4100"]
        labels:
          layer: judgment

  # Prometheus itself, so a dashboard can show whether scraping is healthy.
  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9090"]
