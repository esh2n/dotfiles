}

rect.wu-focal, circle.wu-focal, ellipse.wu-focal, polygon.wu-focal, path.wu-focal {
  stroke: var(--wu-accent);
}</style><rect width="100%" height="100%" fill="var(--wu-surface)"></rect><title id="wu-d-pr-pack-flow-title">PR を作るまでの手順</title><desc id="wu-d-pr-pack-flow-desc">SHA は push 後に決まるので、本文の生成は 2 回目の pr-pack になる</desc><defs><marker id="wu-d-pr-pack-flow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"></path></marker></defs><rect id="wu-d-pr-pack-flow-lane-writeup" x="16" y="16" width="72" height="72" fill="var(--wu-rule-soft)" stroke="none"></rect><rect id="wu-d-pr-pack-flow-lane-git" x="16" y="88" width="72" height="72" fill="var(--wu-rule-soft)" stroke="none"></rect><rect id="wu-d-pr-pack-flow-lane-gh" x="16" y="160" width="72" height="72" fill="var(--wu-rule-soft)" stroke="none"></rect><line id="wu-d-pr-pack-flow-rule-0" x1="16" y1="88" x2="1068" y2="88" stroke="var(--wu-rule)" stroke-width="1"></line><line id="wu-d-pr-pack-flow-rule-1" x1="16" y1="160" x2="1068" y2="160" stroke="var(--wu-rule)" stroke-width="1"></line><line id="wu-d-pr-pack-flow-rule-2" x1="88" y1="16" x2="88" y2="232" stroke="var(--wu-rule)" stroke-width="1"></line><rect id="wu-d-pr-pack-flow-frame" x="16" y="16" width="1052" height="216" fill="none" stroke="var(--wu-rule)" stroke-width="1"></rect><text id="wu-d-pr-pack-flow-lane-writeup-label" x="52" y="56" font-size="13" text-anchor="middle" fill="currentColor">writeup</text><text id="wu-d-pr-pack-flow-lane-git-label" x="52" y="128" font-size="13" text-anchor="middle" fill="currentColor">git</text><text id="wu-d-pr-pack-flow-lane-gh-label" x="52" y="200" font-size="13" text-anchor="middle" fill="currentColor">gh</text><path id="wu-d-pr-pack-flow-e-0" d="M200 52 L232 52" fill="none" stroke="currentColor" stroke-width="1" marker-end="url(#wu-d-pr-pack-flow-solid)"></path><path id="wu-d-pr-pack-flow-e-1" d="M376 52 L392 52 L392 124 L408 124" fill="none" stroke="currentColor" stroke-width="1" marker-end="url(#wu-d-pr-pack-flow-solid)"></path><pat