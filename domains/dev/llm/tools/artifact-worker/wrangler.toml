# yoki-artifact — Worker + Static Assets on workers.dev (spike S7).
#
# Cloudflare Access fronts this Worker as a Worker-level application. Behind
# Static Assets the internal router does NOT pass `ctx.access` to the user
# Worker, so identity comes from validating the `Cf-Access-Jwt-Assertion`
# header inside src/auth.mjs — never from `ctx.access` or from the
# `cf-access-authenticated-user-email` convenience header.

name = "yoki-artifact"
main = "src/index.mjs"
# `wrangler dev` refuses a compatibility date newer than the workerd binary its
# own version ships ("newest date supported by this server binary is ..."), so
# for local runs on an older wrangler pass `--compatibility-date <that date>`
# rather than editing this line: deploys must keep the real date.
compatibility_date = "2026-08-31"
workers_dev = true

# public/ holds only the viewer shell (HTML/CSS/JS). Artifact HTML never
# becomes a static asset: it is streamed from R2 by /r/* with a per-response
# sandbox CSP. `run_worker_first` keeps the asset router from answering the
# routes the Worker owns.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/r/*", "/a/*", "/"]

[[r2_buckets]]
binding = "R2"
bucket_name = "yoki-artifact"

[[d1_databases]]
binding = "DB"
database_name = "yoki-artifact"
# Replace with the id printed by `wrangler d1 create yoki-artifact`.
database_id = "4131025f-82a8-4010-8f34-b7e7f59040fe"

# Placeholders — set the real values before deploying (`wrangler deploy --var`
# or by editing this block). They are configuration, not secrets: the Access
# AUD, the team domain and a service-token Client ID are public identifiers.
# src/index.mjs refuses to serve anything if one of the first three is empty.
#
# SERVICE_TOKEN_NAME pins WHICH service token is the owner. Access puts the
# token's Client ID in the JWT's `common_name` claim, so this holds the Client
# ID of the `yoki-artifact-cli` token — scripts/setup.mjs writes it. Left at
# the placeholder, no service token is an owner at all (fail-closed): the CLI
# gets 403 on publish/revoke/share until setup.mjs is re-run.
[vars]
ACCESS_TEAM_DOMAIN = "explain-pages.cloudflareaccess.com"
ACCESS_AUD = "507f1773f7d0c50b2d57b2dc3143bb6b32fbe936dca5683fa542e631f0de8ee2"
OWNER_EMAIL = "esh2n.bz@gmail.com"
SERVICE_TOKEN_NAME = "079c7e6e85ad33761c6cfb46da97110c.access"
