id: fb-over
type: fishbone
title: 予算超過の魚骨図
effect: リリース判定会が毎回 2 時間を超える
categories:
  - id: c1
    label: 人
    causes:
      - label: 参加者が多すぎる
        emphasis: true
      - 決裁者不在
      - 準備不足
      - 発言の偏り
      - 議題外の議論
      - 途中参加が多い
  - id: c2
    label: 方法
    emphasis: true
    causes:
      - 議題が事前共有されない
      - 定型フォーマットなし
      - 判定基準が口頭
  - id: c3
    label: 設備
    causes:
      - label: 会議室の予約が取れない
        emphasis: true
      - 回線が不安定
      - 画面共有が遅い
  - id: c4
    label: 材料
    causes:
      - 検証報告が長い
      - 変更一覧が未整理
      - リスク表が古い
  - id: c5
    label: 計測
    causes:
      - 所要時間を記録していない
      - 議題ごとの時間なし
      - 持ち越し数が不明
  - id: c6
    label: 環境
    causes:
      - リモート混在
      - 時差のある参加者
      - 会議室の騒音
  - id: c7
    label: 管理
    causes:
      - 判定基準が文書化されていない状態
