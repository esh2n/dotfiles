# omp (oh-my-pi) global settings — managed by dotfiles, symlinked to
# ~/.omp/agent/config.yml by link_omp_resources. omp also writes runtime
# settings into this file (saves re-read under a lock, external edits are
# preserved), same arrangement as pi's settings.json.
#
# Guard posture mirrors pi: no approval prompts (yolo), determinism comes from
# the yoki-guard extension (extensions/yoki-guard.ts) which runs the same
# ~/.claude/hooks/* as Claude Code. The layers below are belt-and-suspenders
# for when the extension is not loaded (e.g. `command omp` bypassing the zsh
# wrapper).

tools:
  # Explicit, not inherited: yolo is also omp's default, but the guard design
  # depends on it being a choice. Untrusted repos belong in the sandbox (yomp).
  approvalMode: yolo
  approval:
    # eval (persistent py/js/rb/jl runtimes) can spawn shells via subprocess and
    # is documented to bypass bash.patterns (docs/settings.md). Gate it.
    eval: prompt

bash:
  # git-guard.sh (via yoki-guard.ts) is the authority on these; the pattern
  # rules only catch the case where the extension failed to load. deny rules
  # match any segment of a compound command, so `cd x && git push -f` is caught.
  patterns:
    - match: "git push --force*"
      approval: deny
    - match: "git push -f*"
      approval: deny
