# User patch layer for the `proxy` profile — symlinked to
# ~/.dsh/profiles/proxy/cordis.patch.yml by manager.sh link_dsh_resources.
#
# dsh-base's agent-default-model row starts sessions on deepseek-official /
# deepseek-flash (a DIRECT provider connection). This row overrides it by id
# (last write wins per row; a patch replaces the row's whole config) so every
# session starts on the local LiteLLM proxy and lands on the measurement
# plane. The provider/model ids come from settings.yaml (local-proxy / main).
#
# Confirm at first run: the base patch documents rows-by-id override for the
# user patch layer; if dsh rejects `insert` for an existing id, check the dsh
# README for the dedicated override op.
- insert:
    - id: agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: local-proxy
        model: main
