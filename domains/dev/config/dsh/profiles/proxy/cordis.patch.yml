# User patch layer for the `proxy` profile — symlinked to
# ~/.dsh/profiles/proxy/cordis.patch.yml by manager.sh link_dsh_resources.
#
# dsh-base's agent-default-model row starts sessions on deepseek-official /
# deepseek-flash (a DIRECT provider connection). This row overrides it by id
# (last write wins per row; a patch replaces the row's whole config) so every
# session starts on the local LiteLLM proxy and lands on the measurement
# plane. The provider/model ids come from settings.yaml (local-proxy / main).
#
# Confirm at first run: the base patch documents rows-by-id override for the
# user patch layer; if dsh rejects `insert` for an existing id, check the dsh
# README for the dedicated override op.
#
# hooks-claude wires dsh into jig's own PreToolUse hook via the official
# @deepseek-ai/dsh-hooks-claude-code bridge, pointed at ~/.dsh/hooks.claude.json
# (symlinked from ../../hooks.claude.json by manager.sh link_dsh_resources).
# That file's PreToolUse command runs the SAME evaluator Claude Code and
# pi's guard.ts use, against the SAME shared policy
# (domains/dev/llm/harness/policy/guard-rules.json) — Phase 1 guard-policy
# unification's third front.
#
# UNVERIFIED until dsh first runs: the bridge's matcher/payload semantics
# (see hooks.claude.json's own "_unverified" note) — confirm at first run
# and fix here if dsh's tool naming or hook payload shape differs.
#
# configPath is a literal absolute string (personal-repo absolute-path
# convention, same as hooks.claude.json's own command), not the `!!js` tag
# this file used before: a default YAML schema throws on an unknown `!!js`
# tag and drops the WHOLE patch silently, losing the guard hook and the
# default-model override together — see the review finding this replaced.
- insert:
    - id: agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: local-proxy
        model: main
    - id: hooks-claude
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: '/Users/esh2n/.dsh/hooks.claude.json'
        projectDir: '.'
