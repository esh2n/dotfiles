# User patch layer for the `headless` profile — symlinked to
# ~/.dsh/profiles/headless/cordis.patch.yml by manager.sh link_dsh_resources.
# Same default-model override as the proxy profile: one-shot headless runs
# must also go through the local LiteLLM proxy (measurement plane), not a
# direct provider connection. See profiles/proxy/cordis.patch.yml for the
# override semantics.
#
# hooks-claude wires dsh into jig's own PreToolUse hook via the official
# @deepseek-ai/dsh-hooks-claude-code bridge, pointed at ~/.dsh/hooks.claude.json
# (symlinked from ../../hooks.claude.json by manager.sh link_dsh_resources).
# Same policy as the proxy profile — see profiles/proxy/cordis.patch.yml for
# the override semantics and the unverified-bridge caveat.
#
# configPath is a literal absolute string, not the `!!js` tag this file used
# before: a default YAML schema throws on an unknown `!!js` tag and drops
# the WHOLE patch silently, losing the guard hook and the default-model
# override together — see profiles/proxy/cordis.patch.yml for the full note.
- insert:
    - id: agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: local-proxy
        model: main
    - id: hooks-claude
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: '/Users/esh2n/.dsh/hooks.claude.json'
        projectDir: '.'
