id: d-chain-long
title: 長いノードラベルと短いエッジラベルの縦チェーン
caption: down方向で層間の空白が過大にならないことを確かめる回帰フィクスチャ。
direction: down
nodes:
- id: n0
  label: アップロード可能な最大ファイルサイズの設定値
- id: n1
  label: 画像リサイズジョブをキューへ登録する処理
- id: n2
  label: 非同期ワーカーによるS3アップロード変換処理
- id: n3
