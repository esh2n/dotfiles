id: s-class
type: schema
title: 図形の型階層
caption: Shape が抽象。Canvas は図形を所有し、パレットは共有する
variant: class
entities:
  - id: shape
    label: Shape
    emphasis: true
    fields:
      - name: id
        type: string
      - name: origin
        type: Point
    methods:
      - "+ area(): number"
      - "+ bounds(): Rect"
  - id: circle
    label: Circle
    fields:
      - name: radius
        type: number
    methods:
      - "+ area(): number"
  - id: rect
    label: Rect
    fields:
      - name: w
        type: number
      - name: h
        type: number
    methods:
      - "+ area(): number"
  - id: canvas
    label: Canvas
    fields:
      - name: shapes
        type: Shape[]
    methods:
      - "+ add(s: Shape)"
  - id: palette
    label: Palette
    fields:
      - name: colors
        type: string[]
  - id: renderer
    label: Renderer
    methods:
      - "+ draw(c: Canvas)"
relations:
  - from: circle
    to: shape
    kind: inherits
  - from: rect
    to: shape
    kind: inherits
  - from: canvas
    to: shape
    kind: composition
    label: 所有
    from_card: "1"
    to_card: "*"
  - from: canvas
    to: palette
    kind: aggregation
    label: 参照
  - from: renderer
    to: canvas
    kind: uses
    label: 描画
